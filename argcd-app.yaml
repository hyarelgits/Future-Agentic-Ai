apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sre-copilot
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hyarelgits/Future-Agentic-Ai
    targetRevision: master
    path: helm-chart/sre-copilot

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

