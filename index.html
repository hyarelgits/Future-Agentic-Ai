  --surface:#FFFFFF;
  --surface2:#FFF1DC;
  --surface3:#EEF2FF;
  --text:#1B1E2E;
  --muted:#6B7280;
  --line:#EADFCB;
  --primary:#4F46E5;
  --primary2:#FF6B2E;
  --green:#0E9F6E;
  --amber:#F59E0B;
  --red:#EF4444;
  --code-bg:#111827;
  --code-text:#E5E7EB;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#111827;
    --surface:#1F2937;
    --surface2:#2B3648;
    --surface3:#2A2E5A;
    --text:#F9FAFB;
    --muted:#CBD5E1;
    --line:#374151;
    --primary:#A5B4FC;
    --primary2:#FB923C;
    --code-bg:#0B1220;
    --code-text:#E5E7EB;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Nunito',system-ui,sans-serif
}

.font-display{
  font-family:'Fredoka','Nunito',system-ui,sans-serif
}

.mono{
  font-family:'JetBrains Mono',ui-monospace,monospace
}

.codeblock{
  background:var(--code-bg);
  color:var(--code-text);
  border-radius:14px;
  padding:14px 14px 12px;
  overflow-x:auto;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  line-height:1.65;
  white-space:pre;
  -webkit-user-select:text;
     -moz-user-select:text;
          user-select:text
}

.codeblock::-webkit-scrollbar{
  height:8px;
  width:8px
}

.codeblock::-webkit-scrollbar-thumb{
  background:#4b5563;
  border-radius:99px
}

.tab-btn{
  transition:.15s
}

.tab-btn.active{
  background:var(--text);
  color:white
}

.chip{
  border:1px solid var(--line);
  background:var(--surface)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px
}

th{
  text-align:left;
  padding:10px 10px;
  background:var(--surface2);
  border-bottom:1px solid var(--line)
}

td{
  padding:10px;
  border-bottom:1px solid var(--line);
  vertical-align:top
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:hidden {
    display: none;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-6 {
    padding-top: 1.5rem;
    padding-bottom: 1.5rem;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }

  .sm\:text-\[34px\] {
    font-size: 34px;
  }

  .sm\:text-\[36px\] {
    font-size: 36px;
  }

  .sm\:text-\[40px\] {
    font-size: 40px;
  }
}

@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

import json  # import json - save chat as text
# connect to Redis on localhost, port 6379
r = redis.Redis(host="localhost", port=6379, decode_responses=True)

def save_chat(user_id, message):  # save one chat message
    # push message into list for this user
    r.lpush(f"chat:{user_id}", json.dumps(message))
    # keep only last 10 messages - short-term memory
    r.ltrim(f"chat:{user_id}", 0, 9)
    return "SAVED"  # return SAVED

def get_chat(user_id):  # get last 10 chats
    # read list from Redis
    data = r.lrange(f"chat:{user_id}", 0, 9)
    # turn text back to Python list
    return [json.loads(x) for x in data]

if __name__ == "__main__":  # test only when run directly
    print(save_chat("user1", {"msg": "Pod CrashLoopBackOff"}))  # test save
    print(get_chat("user1"))  # test get`})}),a(R,{n:"B",title:"memory/qdrant_memory.py — long-term memory",children:a(I,{title:"memory/qdrant_memory.py",children:`from qdrant_client import QdrantClient, models  # import Qdrant client + models
